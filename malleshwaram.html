<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>we went to bangalore just to go to malleshwaram area</title>
  <style>
    body {
      margin: 0;
      background: url('Bangalore-traffic.jpg') center center/cover no-repeat;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.68);
      pointer-events: none;
      z-index: 1;
    }
    .container {
      z-index: 2;
      position: relative;
      background: rgba(18, 18, 18, 0.92);
      border-radius: 32px;
      box-shadow: 0 0 48px 16px rgba(0, 0, 0, 0.85);
      padding: 40px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 980px;
      backdrop-filter: blur(2px);
      margin: 0 auto;
    }
    .title {
      font-family: 'Dancing Script', cursive;
      font-size: 4em;
      color: #c1ff85;
      margin-bottom: 48px;
      letter-spacing: 2px;
      text-shadow: 0 4px 36px rgba(193, 255, 133, 0.55);
    }
    .video-wrapper {
      width: 900px;
      height: 506px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 0 48px 10px #232323;
      background: #191919;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .video-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      pointer-events: none;
      transition: transform 0.5s ease;
    }
    .video-wrapper:hover img {
      transform: scale(1.1);
    }
    @media (max-width: 1000px) {
      .video-wrapper {
        width: 98vw;
        height: calc(98vw * 0.56);
      }
      .container {
        max-width: 98vw;
        padding: 10px;
      }
      .title {
        font-size: 2em;
      }
    }
  </style>
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container">
    <div class="title">what ra sudeep</div>
    <div class="video-wrapper" onclick="window.open('https://www.youtube.com/watch?v=vLd6hit7beE', '_blank')">
      <img src="IMG_8243.JPG" alt="boys in malleshwaram" />
    </div>
  </div>
</body>
</html>
